[project]
name = "hybridedge-llm"
version = "0.1.0"
description = "Hybrid cloud/edge multi-agent system that keeps working when the network drops."
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.162.7",
    "httpx>=0.28.1",
    "langgraph>=1.2.22",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "openai>=3.51.0",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "modal>=1.6.4",
    "pytest>=9.2.0",
]
