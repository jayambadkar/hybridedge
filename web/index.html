<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fafaf9" />
  <title>HybridEdge</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2318181b'/%3E%3Cpath d='M9 17l5-9v7h5l-5 9v-7z' fill='%23fff'/%3E%3C/svg%3E" />
</head>
<body>
  <div class="statusbar sb-wait" id="statusBar" role="status" aria-live="assertive">
    <span class="sb-dot" aria-hidden="true"></span>
    <span class="sb-title">Connecting…</span>
    <span class="sb-detail"></span>
  </div>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span class="mark" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M9 17l5-9v7h5l-5 9v-7z" /></svg></span>
        <span>HybridEdge</span>
        <button class="icon-btn sb-close" id="sidebarClose" aria-label="Collapse sidebar" title="Collapse sidebar"><svg viewBox="0 0 20 20"><rect x="3" y="3" width="14" height="14" rx="3" /><path d="M8 3v14" /></svg></button>
      </div>
      <button class="new-btn" id="newThread"><svg viewBox="0 0 20 20"><path d="M10 4v12M4 10h12" /></svg>New incident</button>
      <nav class="threads" id="threads" aria-label="Incidents"></nav>
      <button class="settings-btn" id="settingsBtn"><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="2.5" /><path d="M10 2.5v2M10 15.5v2M17.5 10h-2M4.5 10h-2M15.3 4.7l-1.4 1.4M6.1 13.9l-1.4 1.4M15.3 15.3l-1.4-1.4M6.1 6.1L4.7 4.7" /></svg>Settings</button>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menuBtn" aria-label="Show incidents" title="Show incidents"><svg viewBox="0 0 20 20"><path d="M3 6h14M3 10h14M3 14h14" /></svg></button>
        <h1 class="title" id="title">New incident</h1>
        <div class="top-actions">
          <div class="link-wrap">
            <button class="link-pill" id="linkPill" aria-haspopup="true" aria-expanded="false">
              <span class="dot"></span><span class="link-text">Connecting…</span>
            </button>
            <div class="popover" id="linkPop" hidden></div>
          </div>
          <button class="icon-btn" id="inspectorBtn" aria-label="Show incident log and checkpoints" aria-expanded="false" title="Incident log & checkpoints">
            <svg viewBox="0 0 20 20"><rect x="3" y="3" width="14" height="14" rx="3" /><path d="M12 3v14" /></svg>
          </button>
        </div>
      </header>

      <section class="feed" id="feed" aria-live="polite"></section>
      <section class="settings" id="settings" hidden></section>

      <footer class="composer-wrap">
        <form class="composer" id="composer">
          <textarea id="input" rows="1" placeholder="Describe the situation or ask a question…" autocomplete="off"></textarea>
          <button type="submit" class="send" id="send" aria-label="Send"><svg viewBox="0 0 20 20"><path d="M10 16V4M5 9l5-5 5 5" /></svg></button>
        </form>
        <div class="hint" id="hint">Every agent step is checkpointed on this device.</div>
      </footer>
    </main>

    <aside class="inspector" id="inspector" hidden>
      <div class="ins-h">
        <span>Incident details</span>
        <button class="icon-btn" id="inspectorClose" aria-label="Close panel" title="Close"><svg viewBox="0 0 20 20"><path d="M5 5l10 10M15 5L5 15" /></svg></button>
      </div>
      <section class="panel" data-panel="log">
        <button class="panel-h" data-toggle="log" aria-expanded="true">
          <svg class="chev" viewBox="0 0 20 20"><path d="M7 5l5 5-5 5" /></svg>
          <span>Incident log</span><span class="count" id="logCount"></span>
        </button>
        <div class="panel-b" id="logBody"></div>
      </section>
      <section class="panel" data-panel="checkpoints">
        <button class="panel-h" data-toggle="checkpoints" aria-expanded="false">
          <svg class="chev" viewBox="0 0 20 20"><path d="M7 5l5 5-5 5" /></svg>
          <span>Checkpoints</span><span class="count" id="cpCount"></span>
        </button>
        <div class="panel-b" id="cpBody"></div>
      </section>
    </aside>
  </div>
  <div class="toast" id="toast" hidden></div>
  <script src="/app.js"></script>
</body>
</html>
