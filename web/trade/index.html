<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aimo Trade</title>
  <link rel="stylesheet" href="/trade/trade.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23111'/%3E%3Cpath d='M9 22l7-13 7 13M12 17h8' fill='none' stroke='%2376b900' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
</head>
<body>
  <header class="bar">
    <div class="brand"><span class="logo">A</span>Aimo Trade</div>
    <div class="search"><input id="q" placeholder="Search products" autocomplete="off" /></div>
    <div class="bar-r">
      <div class="pop-wrap">
        <button class="net" id="net"><i></i><span id="netText">Checking…</span></button>
        <div class="pop" id="netPop" hidden>
          <div class="pop-t" id="netInfo"></div>
          <button class="btn full" id="drill"></button>
        </div>
      </div>
      <select id="store" aria-label="Store"></select>
    </div>
  </header>

  <div class="signal" id="signal">
    <div class="sig-state"><i></i><b id="sigState">Checking the link…</b><span id="sigSub"></span></div>
    <div class="sig-hist" title="Satellite link, last 24 hours"><span>24 h</span><div id="sigBars"></div><span>now</span></div>
    <div class="sig-stats" id="sigStats"></div>
  </div>
  <div class="shell">
    <nav class="nav" id="nav">
      <a data-p="home" class="on"><svg viewBox="0 0 20 20"><path d="M3 9l7-6 7 6v8H3z"/></svg>Home</a>
      <a data-p="orders"><svg viewBox="0 0 20 20"><path d="M4 3h12v14H4zM7 7h6M7 10h6M7 13h4"/></svg>Orders<b id="navApprovals" hidden></b></a>
      <a data-p="products"><svg viewBox="0 0 20 20"><path d="M3 6l7-3 7 3v8l-7 3-7-3zM3 6l7 3 7-3M10 9v8"/></svg>Products</a>
      <a data-p="inventory"><svg viewBox="0 0 20 20"><path d="M3 4h14v4H3zM4 8v8h12V8M8 11h4"/></svg>Inventory<b id="navLow" hidden></b></a>
      <a data-p="routes"><svg viewBox="0 0 20 20"><path d="M4 16c0-6 12-6 12-12M4 16a1.5 1.5 0 100 .1M16 4a1.5 1.5 0 100 .1"/></svg>Supply routes</a>
      <div class="nav-h">Agents</div>
      <a data-p="agents"><svg viewBox="0 0 20 20"><path d="M10 2l2 5 5 1-4 3 1 5-4-3-4 3 1-5-4-3 5-1z"/></svg>Agent tasks<b id="navRun" hidden>•</b></a>
      <a data-p="inference"><svg viewBox="0 0 20 20"><path d="M3 15l4-5 3 3 4-6 3 4M3 17h14"/></svg>Inference</a>
      <div class="nav-foot">
        <div id="storeMeta"></div>
        <button class="lnk" id="reset">Reset demo</button>
      </div>
    </nav>

    <main class="page" id="page"></main>
  </div>
  <div class="toast" id="toast" hidden></div>
  <script src="/trade/trade.js" type="module"></script>
</body>
</html>
